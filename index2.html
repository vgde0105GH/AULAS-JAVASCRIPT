<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Loja de Eletrônicos</title>

  <link rel="stylesheet" href="./style2.css" />
</head>

<body>
  <h1>Loja de Eletrônicos</h1>

  <main>
    <h2>Selecione seus produtos:</h2>

    <!-- Os produtos criados pelo JavaScript aparecerão aqui -->
    <ul id="lista-produtos"></ul>
  </main>

  <aside>
    <h2>Carrinho</h2>

    <!-- Os itens adicionados ao carrinho aparecerão aqui -->
    <ul id="carrinho"></ul>

    <!-- Texto com itens selecionados e valor total -->
    <p id="resumo-carrinho">
      Nenhum item foi selecionado.
    </p>
  </aside>

  <script type="module" src="./script.js"></script>
</body>
</html>
